<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 132" fill="none">
  <defs>
    <linearGradient id="bnBg" x1="0" y1="0" x2="360" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5F9"/>
      <stop offset="55%" stop-color="#FFE4F0"/>
      <stop offset="100%" stop-color="#FFD4E6"/>
    </linearGradient>
    <linearGradient id="bnFur" x1="175" y1="22" x2="175" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F6"/>
    </linearGradient>
    <linearGradient id="bnDesk" x1="0" y1="98" x2="0" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC6DD"/>
      <stop offset="100%" stop-color="#FFB1D0"/>
    </linearGradient>
    <linearGradient id="bnBow" x1="0" y1="0" x2="26" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF78AC"/>
      <stop offset="100%" stop-color="#EC3F7F"/>
    </linearGradient>
    <clipPath id="bnClip">
      <rect width="360" height="132" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bnClip)">
  <!-- Soft pastel sky backdrop -->
  <rect width="360" height="132" fill="url(#bnBg)"/>

  <!-- Dreamy clouds -->
  <g fill="#FFFFFF" opacity="0.72">
    <circle cx="48" cy="36" r="16"/>
    <circle cx="64" cy="32" r="20"/>
    <circle cx="82" cy="37" r="14"/>
    <circle cx="288" cy="30" r="15"/>
    <circle cx="306" cy="27" r="18"/>
    <circle cx="322" cy="33" r="13"/>
  </g>

  <!-- Drifting Sakura Petals & Sparkles -->
  <path d="M36 66 C41 61 48 63 46 70 C44 74 37 73 36 66 Z" fill="#FF9AC2" opacity="0.7"/>
  <path d="M312 58 C318 53 324 56 321 62 C318 66 312 64 312 58 Z" fill="#FF89B7" opacity="0.75"/>
  <path d="M114 26 L116 20 L118 26 L124 28 L118 30 L116 36 L114 30 L108 28 Z" fill="#FF73A8"/>
  <path d="M250 22 L251.5 17.5 L253 22 L257.5 23.5 L253 25 L251.5 29.5 L250 25 L245.5 23.5 Z" fill="#FFB93E"/>
  <path d="M268 48 C268 44 262 42 260 46 C258 42 252 44 252 48 C252 53 260 58 260 58 C260 58 268 53 268 48 Z" fill="#FF6FA3" opacity="0.88"/>

