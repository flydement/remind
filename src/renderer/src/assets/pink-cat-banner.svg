  <g transform="translate(38, 66)">
    <path d="M8 22 L12 36 H28 L32 22 Z" fill="#FF8AB7" stroke="#5C2641" stroke-width="2.3" stroke-linejoin="round"/>
    <rect x="6" y="18" width="28" height="6" rx="3" fill="#FFA8CA" stroke="#5C2641" stroke-width="2.3"/>
    <path d="M20 18 C20 10 20 7 20 4" stroke="#5C2641" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M20 11 C13 9 10 3 16 1 C20 0 21 6 20 11 Z" fill="#7CD4A4" stroke="#5C2641" stroke-width="2"/>
    <path d="M20 11 C27 9 30 3 24 1 C20 0 19 6 20 11 Z" fill="#5BC48D" stroke="#5C2641" stroke-width="2"/>
    <circle cx="20" cy="1" r="3.4" fill="#FF73A8" stroke="#5C2641" stroke-width="1.6"/>
