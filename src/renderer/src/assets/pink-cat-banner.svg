    <path d="M26 31 C24 22 25 14 29 13 C33 13 38 18 41 24 Z" fill="#FFA8CA"/>
    <path d="M78 36 C83 20 79 8 71 7 C64 6 57 16 54 23 Z" fill="url(#bnFur)" stroke="#5C2641" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M74 31 C76 22 75 14 71 13 C67 13 62 18 59 24 Z" fill="#FFA8CA"/>

    <!-- Head -->
    <path d="M17 48 C17 28 31 19 50 19 C69 19 83 28 83 48 C83 66 69 75 50 75 C31 75 17 66 17 48 Z" fill="url(#bnFur)" stroke="#5C2641" stroke-width="2.9" stroke-linejoin="round"/>

