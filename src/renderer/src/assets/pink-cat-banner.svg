    <path d="M22 79 C12 73 10 62 17 59 C23 57 28 65 29 74" fill="#FFFFFF" stroke="#5C2641" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="65" r="2.2" fill="#FFA6C9"/>

    <!-- Little Pink Pencil & Right Paw -->
    <g transform="translate(74, 62) rotate(26)">
      <rect x="0" y="0" width="6" height="24" rx="2" fill="#FF85B3" stroke="#5C2641" stroke-width="1.9"/>
      <path d="M0 24 L3 30 L6 24 Z" fill="#FFE0B5" stroke="#5C2641" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <ellipse cx="75" cy="83" rx="9" ry="7" fill="#FFFFFF" stroke="#5C2641" stroke-width="2.6"/>
  </g>

  <!-- Right-mid: Mini Checklist Notebook -->
  <g transform="translate(232, 76)">
    <rect x="0" y="2" width="44" height="30" rx="6" fill="#FFFFFF" stroke="#5C2641" stroke-width="2.4"/>
    <line x1="22" y1="2" x2="22" y2="32" stroke="#F3A6C6" stroke-width="1.8"/>
    <path d="M6 11 L9 14 L14 8" stroke="#F04E88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="21" x2="17" y2="21" stroke="#F5B6D0" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="11" x2="38" y2="11" stroke="#F5B6D0" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="18" x2="36" y2="18" stroke="#F5B6D0" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="25" x2="38" y2="25" stroke="#F5B6D0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Far Right: Cute Pink Yarn Ball -->
  <g transform="translate(294, 72)">
    <path d="M28 28 C38 30 44 24 50 27" stroke="#F04E88" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="18" cy="18" r="16" fill="#FF92BC" stroke="#5C2641" stroke-width="2.5"/>
    <path d="M6 12 C14 14 22 10 30 14" stroke="#FFD6E7" stroke-width="2" stroke-linecap="round"/>
    <path d="M4 20 C14 23 24 19 32 22" stroke="#FFD6E7" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 4 C10 14 14 24 10 32" stroke="#E04880" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  </g>
  </g>
