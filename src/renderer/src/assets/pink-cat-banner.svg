  <g transform="translate(88, 72)">
    <path d="M9 -4 C8 -8 12 -10 11 -14" stroke="#FF8EB8" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M18 -5 C17 -9 21 -11 20 -15" stroke="#FF8EB8" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M27 8 C34 8 34 22 27 22" stroke="#5C2641" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="3" y="3" width="24" height="27" rx="7" fill="#FFFFFF" stroke="#5C2641" stroke-width="2.5"/>
    <rect x="3" y="18" width="24" height="12" rx="6" fill="#FFD1E3" stroke="#5C2641" stroke-width="2.3"/>
