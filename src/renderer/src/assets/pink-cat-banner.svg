    <g transform="translate(69, 18) rotate(16)">
      <path d="M-2 0 C-8 -7 -15 -4 -14 2 C-13 7 -7 7 -2 2 Z" fill="url(#bnBow)" stroke="#5C2641" stroke-width="2.1" stroke-linejoin="round"/>
      <path d="M2 0 C8 -7 15 -4 14 2 C13 7 7 7 2 2 Z" fill="url(#bnBow)" stroke="#5C2641" stroke-width="2.1" stroke-linejoin="round"/>
      <circle cx="0" cy="1" r="3.6" fill="#FF4B8B" stroke="#5C2641" stroke-width="2"/>
    </g>

    <!-- Happy Sparkling Eyes -->
    <ellipse cx="36" cy="45" rx="4.8" ry="5.5" fill="#4B1D35"/>
    <circle cx="34.4" cy="43" r="1.9" fill="#FFFFFF"/>
    <ellipse cx="64" cy="45" rx="4.8" ry="5.5" fill="#4B1D35"/>
    <circle cx="62.4" cy="43" r="1.9" fill="#FFFFFF"/>

    <!-- Cheeks & Smile -->
    <ellipse cx="27" cy="53" rx="6.5" ry="3.8" fill="#FF89B7" opacity="0.58"/>
    <ellipse cx="73" cy="53" rx="6.5" ry="3.8" fill="#FF89B7" opacity="0.58"/>
    <path d="M48 50.5 C48 49.2 52 49.2 52 50.5 C52 51.8 50 53.3 50 53.3 C50 53.3 48 51.8 48 50.5 Z" fill="#FF669B"/>
    <path d="M44 55.5 C45.2 58.5 48.8 58.3 50 55.8 C51.2 58.3 54.8 58.5 56 55.5" stroke="#5C2641" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Whiskers -->
    <path d="M10 47 L20 49 M9 53 L19 52" stroke="#6E3552" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M90 47 L80 49 M91 53 L81 52" stroke="#6E3552" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Collar & Bell -->
    <path d="M35 73 C43 77 57 77 65 73" stroke="#F04E88" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="50" cy="78" r="5" fill="#FFD35A" stroke="#5C2641" stroke-width="2"/>

