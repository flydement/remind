<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工作提醒</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    display: flex;
    height: 100%;
    padding: 10px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
    overflow: hidden;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid rgba(15, 23, 42, 0.14);
    border-radius: 16px;
    padding: 18px 20px 16px;
    box-shadow: 0 18px 42px rgba(15, 23, 42, 0.24);
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 4px;
    background: linear-gradient(90deg, #2563eb, #38bdf8, #059669);
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .kind {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #2563eb;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
  }
  .brand {
    font-size: 11px;
    color: #64748b;
  }
  .title {
    font-size: 17px;
    font-weight: 700;
    color: #0f172a;
    margin: 10px 0 6px;
    line-height: 1.38;
  }
  .body {
    flex: 1;
    font-size: 13px;
    color: #475569;
    line-height: 1.6;
    margin: 0;
  }
  .foot {
    display: flex;
    justify-content: flex-end;
    gap: 7px;
    margin-top: 14px;
  }
  button {
    appearance: none;
    border: 0;
    background: #2563eb;
    color: #ffffff;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }
  button.ghost {
    background: #f8fafc;
    color: #0f172a;
    border: 1px solid rgba(15, 23, 42, 0.15);
  }
  button.ghost:hover { background: #e2e8f0; }
  button.done {
    background: #059669;
  }
  button.done:hover { background: #047857; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="kind"><span class="dot"></span>工作事项提醒</div>
      <span class="brand">小猫工作助手</span>
    </div>
    <b class="title" id="t"></b>
    <p class="body" id="b"></p>
    <div class="foot">
      <button class="ghost" id="snooze" hidden>延后10分钟</button>
      <button class="ghost" id="snooze60" hidden>延后1小时</button>
      <button class="done" id="done" hidden>标记完成</button>
      <button id="ok">确认</button>
    </div>
  </div>
  <script>
    let currentWorkId = null
    const snoozeBtn = document.getElementById('snooze')
    const snooze60Btn = document.getElementById('snooze60')
    const doneBtn = document.getElementById('done')
    const okBtn = document.getElementById('ok')

    if (window.rian) {
      window.rian.onReminder((ev) => {
        currentWorkId = ev.workId || null
        document.getElementById('t').textContent = ev.title
        document.getElementById('b').textContent = ev.body
        snoozeBtn.hidden = !currentWorkId
        snooze60Btn.hidden = !currentWorkId
        doneBtn.hidden = !currentWorkId
      })
      okBtn.addEventListener('click', () => window.rian.dismissReminder())
      snoozeBtn.addEventListener('click', () => {
        if (currentWorkId) window.rian.snoozeReminder(currentWorkId, 10)
        else window.rian.dismissReminder()
      })
      snooze60Btn.addEventListener('click', () => {
        if (currentWorkId) window.rian.snoozeReminder(currentWorkId, 60)
        else window.rian.dismissReminder()
      })
      doneBtn.addEventListener('click', () => {
        if (currentWorkId) window.rian.completeReminder(currentWorkId)
        else window.rian.dismissReminder()
      })
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.rian.dismissReminder()
      })
    }
  </script>
</body>
</html>
