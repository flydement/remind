name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - V2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build current branch
        run: npm run build

      - name: Assemble Pages site (/ = main, /v2/ = V2 preview)
        if: github.event_name != 'pull_request'
        run: |
          rm -rf /tmp/pages-site /tmp/dist-current /tmp/main-wt /tmp/v2-wt
          mkdir -p /tmp/pages-site
          cp -r dist-web /tmp/dist-current
          if [ "${GITHUB_REF}" = "refs/heads/V2" ]; then
            git worktree add /tmp/main-wt origin/main
            (cd /tmp/main-wt && npm ci && npm run build)
            cp -r /tmp/main-wt/dist-web/. /tmp/pages-site/
            cp -r /tmp/dist-current /tmp/pages-site/v2
            cp -r /tmp/dist-current /tmp/pages-site/V2
          else
            cp -r /tmp/dist-current/. /tmp/pages-site/
            if git rev-parse --verify origin/V2 >/dev/null 2>&1; then
              git worktree add /tmp/v2-wt origin/V2
              (cd /tmp/v2-wt && npm ci && npm run build)
              cp -r /tmp/v2-wt/dist-web /tmp/pages-site/v2
              cp -r /tmp/v2-wt/dist-web /tmp/pages-site/V2
            fi
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages-site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
